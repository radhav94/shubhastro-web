<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="src/assets/images/mobile-shubh-astro-logo.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

  <title>ShubhAstro</title>
  <style>
    body {
      background-color: #ebecf2;
      background-image: url('/src/assets/images/main-body-bg-new.png');
      background-repeat: repeat-y;
      background-attachment: fixed;
      background-size: 100% 100%;
      position: relative;
      margin: 0;
      padding: 0;
    }

    /* Astrologer card — global background */
    [class*="astrologerCard"],
    [class*="detailsCard"],
    [class*="detailsImageWrapper"] {
      background: rgba(255, 255, 255, 0.25) !important;
    }
  </style>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
  <!-- Google translate -->
  <div id="google_translate_element"></div>

  <script type="text/javascript">
    function googleTranslateElementInit() {
      new google.translate.TranslateElement(
        { pageLanguage: "en", includedLanguages: "en,hi,kn,bn,ta,te,ml,ar,cs,da,fr,de,id,it,ms,my,pl,es,sv,th,tr", layout: google.translate.TranslateElement.InlineLayout.HORIZONTAL },
        "google_translate_element"
      );
    }
  </script>

  <script src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

</body>

</html>
