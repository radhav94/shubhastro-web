<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content">
  <meta name="theme-color" content="#F75801">
  <script>
    /*
      `globalThis` polyfill. Deliberately the very first statement on the page.

      `globalThis` is ES2020 — Chrome 71, Firefox 65, Safari 12.1. Android System
      WebView updates independently of the OS and is routinely years behind on
      cheap or unpatched devices, so the in-app WebView pages (`?type=webview`)
      see engines older than that. Referencing it there throws
      `ReferenceError: globalThis is not defined`, and when that happens while a
      chunk is being evaluated it aborts the whole chunk — blank page, no
      recovery. Clarity recorded exactly that on /faq and /community-guidelines:
      error at 00:01, 1 click across 3 pages, gone in 100 seconds.

      `build.target` in vite.config.js cannot cover this. esbuild lowers *syntax*
      (that is what the `??` / `||=` floor documented there is for); it does not
      polyfill missing *globals*.

      One assignment fixes it for everything that loads afterwards — our own
      chunks, the lazily-loaded ones that reference it bare (the Agora SDK in
      InteractiveLiveStreaming and VideoCallChat, and LazyCalendar), and any
      third-party tag. Guarding the source in cryptoClient.js was necessary but
      only covered the entry chunk; this covers the rest, including dependency
      code we do not control.

      Same reasoning as the storage shim below for why it lives in index.html:
      ES module imports are evaluated before the importing module's body, so no
      code inside the bundle can be guaranteed to run first.

      `var` and no arrow functions on purpose — this file's early scripts must
      parse on the oldest engine that can reach us, and a parse error here would
      take the page down exactly like the error it is preventing.
    */
    if (typeof globalThis === "undefined") {
      try {
        Object.defineProperty(Object.prototype, "__globalThis__", {
          get: function () {
            return this;
          },
          configurable: true
        });
        __globalThis__.globalThis = __globalThis__;
        delete Object.prototype.__globalThis__;
      } catch (e) {
        // Fallback for engines that refuse the accessor trick. `window` is the
        // global object in every browser context this app runs in (there is no
        // worker entry point), so this is sufficient here.
        if (typeof window !== "undefined") window.globalThis = window;
      }
    }
  </script>
  <script>
    // Storage safety net. MUST stay the first script on the page.
    //
    // (The `globalThis` polyfill above is the only thing permitted to precede
    // it. That one is a single assignment that cannot touch storage, and it has
    // to come first so every later script — this one included — can rely on
    // `globalThis` existing.)
    //
    // When a browser blocks site data, merely READING `window.localStorage`
    // throws "Access is denied for this document" — it does not return null.
    // The app touches localStorage in ~560 places, including a module-scope IIFE
    // in main.jsx that runs before React mounts, so a single throw there aborts
    // evaluation of the bundle and the user gets a blank page. That shows up in
    // analytics as a sub-10-second, zero-click bounce.
    //
    // Rather than guard 560 call sites, swap in an in-memory implementation when
    // the real one is unavailable. The app then runs normally for the visit;
    // nothing persists across reloads, which is the correct outcome for someone
    // who has blocked storage anyway.
    //
    // This has to live in index.html because ES module imports are evaluated
    // before the importing module's body — so no code inside the bundle can be
    // guaranteed to run first.
    (function () {
      function createMemoryStorage() {
        var data = Object.create(null);
        return {
          getItem: function (key) {
            var k = String(key);
            return Object.prototype.hasOwnProperty.call(data, k) ? data[k] : null;
          },
          setItem: function (key, value) { data[String(key)] = String(value); },
          removeItem: function (key) { delete data[String(key)]; },
          clear: function () { data = Object.create(null); },
          key: function (i) { var keys = Object.keys(data); return i in keys ? keys[i] : null; },
          get length() { return Object.keys(data).length; }
        };
      }

      function isUsable(name) {
        try {
          // The property read itself is what throws when access is denied.
          var store = window[name];
          if (!store) return false;
          // Safari private mode and zero-quota contexts expose the object but
          // reject writes, so probe before trusting it.
          var probe = '__storage_probe__';
          store.setItem(probe, '1');
          store.removeItem(probe);
          return true;
        } catch (e) {
          return false;
        }
      }

      ['localStorage', 'sessionStorage'].forEach(function (name) {
        if (isUsable(name)) return;
        try {
          Object.defineProperty(window, name, {
            value: createMemoryStorage(),
            configurable: true
          });
          if (window.console && console.warn) {
            console.warn('[storage] ' + name + ' unavailable — using in-memory fallback for this visit.');
          }
        } catch (e) {
          /* Nothing more we can do; individual call sites will still throw. */
        }
      });
    })();
  </script>
  <script>
    // Global error reporting. Registered early (right after the storage shim) so
    // it also sees failures during bundle parse/evaluation, not just runtime.
    //
    // Two gaps this closes:
    //
    // 1. Opacity. When a script from another origin throws without CORS headers,
    //    the browser hands us the string "Script error." with no file, line or
    //    stack. Analytics then shows an unactionable "script error" that is
    //    indistinguishable from a real app bug. Our own bundle is same-origin
    //    and carries `crossorigin`, so anything masked like this is third-party
    //    (tag manager, analytics, Agora, Maps) — worth labelling as such rather
    //    than chasing.
    //
    // 2. Unhandled promise rejections were not observed at all. A rejected
    //    promise with no .catch() previously vanished silently.
    //
    // Reports go to Clarity (so they attach to the session recording) and to
    // dataLayer. Deliberately does not swallow anything: the browser still logs.
    (function () {
      var MAX_REPORTS = 10;
      var sent = 0;
      var seen = {};

      /*
        Errors thrown by the *containing app's* WebView bridge, not by this site.

        Android's WebView exposes native objects to JS via addJavascriptInterface,
        and Chromium's java_bridge holds them weakly. Once the host app
        backgrounds or tears down the WebView the Java object is collected, and
        any later call from the host's own injected script fails with a message
        containing "java object is gone". In-app browsers commonly name their
        channel method `postMessage`, which is where "error invoking postmessage:
        java object is gone" comes from — observed on Instagram's in-app browser.

        Only the host application can inject those objects. This codebase calls
        postMessage nowhere and has no native bridge of any kind, so a message
        shaped like this cannot originate here and there is no code change that
        would prevent it.

        Labelled rather than dropped, exactly like `masked` above: the report
        still reaches Clarity and dataLayer so the session is not silently
        missing an event, but it is no longer indistinguishable from one of our
        own uncaught errors.
      */
      var HOST_BRIDGE_PATTERNS = ['java object is gone', 'error invoking postmessage'];

      function isHostBridgeError(message) {
        var m = String(message || '').toLowerCase();
        for (var i = 0; i < HOST_BRIDGE_PATTERNS.length; i++) {
          if (m.indexOf(HOST_BRIDGE_PATTERNS[i]) !== -1) return true;
        }
        return false;
      }

      function report(kind, message, source, extra) {
        try {
          message = String(message || 'unknown').slice(0, 300);

          // A cross-origin throw is stripped to this exact shape. Naming it
          // stops it being mistaken for an app-level failure.
          var masked = (message === 'Script error.' || message === 'Script error') && !source;
          var hostBridge = isHostBridgeError(message);

          // Where the error came from, as far as we can tell. 'app' is the only
          // value worth acting on; the other two are environmental.
          var origin = hostBridge ? 'host_webview' : masked ? 'cross_origin' : 'app';

          var key = kind + '|' + message + '|' + (source || '');
          if (seen[key]) return;
          seen[key] = true;
          if (sent >= MAX_REPORTS) return;
          sent++;

          if (typeof window.clarity === 'function') {
            window.clarity(
              'set',
              'jsErrorKind',
              hostBridge ? 'host_webview_bridge' : masked ? 'cross_origin_masked' : kind
            );
            window.clarity('set', 'jsErrorMessage', message);
            // The source was going to dataLayer only, so a Clarity session showed
            // e.g. "Unexpected token '{'" with no way to tell which file threw —
            // ours or a third-party tag. Without it a syntax error is
            // unattributable, which is the one case where the file matters most.
            window.clarity('set', 'jsErrorSource', source || '(unavailable)');
          }

          window.dataLayer = window.dataLayer || [];
          window.dataLayer.push({
            event: 'js_error',
            // error_kind stays the raw kind so any existing GTM trigger keeps
            // working; error_origin is the new dimension to filter on.
            error_kind: kind,
            error_origin: origin,
            error_masked: masked,
            error_message: message,
            error_source: source || '(unavailable)',
            error_detail: extra || ''
          });
        } catch (e) {
          /* reporting must never itself break the page */
        }
      }

      window.addEventListener('error', function (e) {
        // Resource load failures (img/script/link) surface here too, with the
        // element as target and no message — report them separately.
        if (e && e.target && e.target !== window && e.target.tagName) {
          report(
            'resource_error',
            e.target.tagName.toLowerCase() + ' failed to load',
            e.target.currentSrc || e.target.src || e.target.href || ''
          );
          return;
        }
        report(
          'uncaught_error',
          e && e.message,
          e && e.filename ? e.filename + ':' + e.lineno + ':' + e.colno : '',
          e && e.error && e.error.stack ? String(e.error.stack).slice(0, 500) : ''
        );
      }, true);

      window.addEventListener('unhandledrejection', function (e) {
        var r = e && e.reason;
        var msg = r && r.message ? r.message : String(r);
        report(
          'unhandled_rejection',
          msg,
          '',
          r && r.stack ? String(r.stack).slice(0, 500) : ''
        );
      });
    })();
  </script>
  <script>
    // iOS Safari/Chrome ignore `user-scalable=no`, so pinch zoom still zooms the
    // whole page (e.g. when zooming a photo on the AI-Wow camera screens).
    // `gesture*` are the non-standard WebKit pinch events; cancelling them
    // enforces the declared no-zoom intent. They carry no click behaviour, so
    // suppressing them costs nothing.
    //
    // Double-tap zoom is NOT handled here any more. It is now
    // `touch-action: manipulation` on html/body in the stylesheet below.
    //
    // What used to be here, and why it had to go:
    //
    //   var lastTouchEnd = 0;
    //   document.addEventListener('touchend', function (e) {
    //     var now = Date.now();
    //     if (now - lastTouchEnd <= 300) { e.preventDefault(); }
    //     lastTouchEnd = now;
    //   }, { passive: false });
    //
    // Cancelling `touchend` does not just suppress zoom. Per the Touch Events
    // spec, a cancelled touchend also suppresses the compatibility mouse events
    // the browser would synthesise from that tap — mousedown, mouseup and
    // **click**. So on any touch device, a second tap landing within 300ms of a
    // previous one produced no click event at all. Not a slow click, not a
    // mis-targeted click: none.
    //
    // Three things made that much worse than a lost double-tap:
    //
    //  1. `lastTouchEnd = now` ran unconditionally, including on the taps it had
    //     just cancelled. Each suppressed tap therefore reset the window, so
    //     someone tapping at a steady sub-300ms rate had EVERY tap after the
    //     first cancelled, for as long as they kept tapping. A burst of tapping
    //     became a sustained lockout rather than one dropped event.
    //  2. It was position-blind. Two taps on two entirely different controls
    //     300ms apart were treated as a double-tap, so quick sequential
    //     navigation lost its second tap too.
    //  3. It is self-reinforcing in exactly the wrong way. Someone whose tap
    //     appears to do nothing taps again quickly — and that retry was
    //     guaranteed to be cancelled. The interface got less responsive the
    //     harder it was pressed.
    //
    // On a text input the effect is starker still: no click means no focus,
    // which means no keyboard. Clarity session 1893d8t (Sep 3, Facebook in-app
    // browser, mobile) shows the shape of it — a visitor in a live room making
    // "multiple input attempts" against dead clicks from 01:20 to 01:59, then
    // leaving. This handler applied to every page and every control on every
    // touch device, so it is a plausible contributor to a broad share of the
    // dead clicks on mobile, not just that one session.
    //
    // `touch-action: manipulation` is the supported way to express this: it
    // keeps panning and pinch zoom, removes double-tap zoom, and never
    // interferes with click dispatch. Safari has honoured it since 9.3, well
    // below this project's safari13 floor, and it does not disturb the custom
    // touch handling in the live reel or Agora because it changes only the
    // browser's own gesture defaults.
    (function () {
      ['gesturestart', 'gesturechange', 'gestureend'].forEach(function (evt) {
        document.addEventListener(evt, function (e) { e.preventDefault(); }, { passive: false });
      });
    })();
  </script>

  <!--
    Preconnect to critical third-party origins.

    Kept to three. Each preconnect costs a DNS lookup + TCP + TLS handshake that
    competes with the requests that actually block the render, so Lighthouse
    warns above four and the rule of thumb is to spend them only where the
    resource cannot be discovered from the HTML. Two were dropped because they
    were redundant with a request already started during head parse:

      - fonts.googleapis.com — the `rel=preload as=style` a few lines below
        requests that exact URL during parse, which opens the connection itself.
      - www.googletagmanager.com — the GTM and gtag snippets further down inject
        their own <script> tags during parse, opening the connection then, and
        neither is on the LCP path.

    What remains cannot be discovered any earlier:
  -->
  <!-- The font files live on gstatic and are only discovered once the Google
       Fonts stylesheet has been fetched AND parsed, so the handshake would
       otherwise start one full round trip late. -->
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <!-- Hosts the body background artwork (preloaded below) and `heroBg`
       ai-suite.png, the homepage LCP candidate. The hero image URL is a
       hardcoded constant in HomeV2 but is not in the HTML, so it is only
       requested after the bundle executes and React renders — a warm connection
       is worth a slot. -->
  <link rel="preconnect" href="https://assets.shubhastro.ai" />
  <!-- App API origin: on the LCP path of every route. crossorigin is required
       for RTK Query's CORS fetches to reuse the connection, and it matches the
       credential-less CORS fetch in the prefetch script below. Kept even though
       that script warms the same origin on "/", because the prefetch is
       deliberately limited to logged-out visits to the homepage — every other
       route still discovers the API only after the bundle runs. -->
  <link rel="preconnect" href="%VITE_APP_API_BASE_URL%" crossorigin />

  <!--
    Homepage payload prefetch — starts /api/homepage during HTML parse.

    The "/" landing's LCP element is the pageblocker banner in HomeIntroPopup,
    and its URL is only known once this response arrives. That made the LCP path
    four requests deep and strictly serial:

        HTML -> entry JS -> React render -> /api/homepage -> banner image

    so an 18 KB image waited on a ~276 KB (gzip) bundle plus an 87 KB API round
    trip before it could even be discovered. Firing the request here removes the
    bundle from in front of the API call; `src/services/appServices/homeServices.js`
    adopts this in-flight promise inside the endpoint's queryFn, so it stays one
    request rather than becoming two.

    Deliberately narrow, because index.html is shared by every route:
      - only on "/" — no other route reads this slug, and an unconditional
        preload here is exactly the mistake that made every route fetch
        ai-suite.png (see the note further down).
      - only when logged out — the response can vary with the Authorization
        header that RTK Query attaches, and this bare fetch sends none. Logged
        out is also the only state that sees the popup, so nothing is lost.
      - headers match what fetchBaseQuery sends, keeping it a simple CORS
        request with no preflight.
      - page 1 only. HomeV2 fetches the remaining sections itself once the
        browser is idle, so warming those here would compete with first paint
        for exactly the resource this block exists to get out of the way.
    Wrapped in try/catch and given a no-op rejection handler: a failure here must
    never surface as an unhandled rejection or block the app, it just means the
    endpoint requests normally.
  -->
  <script>
    (function () {
      try {
        if (window.location.pathname !== "/") return;
        if (
          localStorage.getItem("shubhtalk_customer_token") ||
          localStorage.getItem("shubhtalk_astro_token")
        ) return;

        var slug = "newcustomerlandingpage";
        // Must match HOME_SECTIONS_PAGE_SIZE in
        // src/services/appServices/homeServices.js — the endpoint compares this
        // limit before adopting the promise, and ignores the prefetch if the two
        // have drifted apart.
        var limit = 5;
        var promise = fetch(
          "%VITE_APP_API_BASE_URL%/api/homepage?slug=" + slug + "&pageNo=1&limit=" + limit,
          { method: "GET", headers: { "Content-Type": "text/plain" } }
        ).then(function (response) {
          if (!response.ok) throw new Error("HTTP " + response.status);
          return response.json();
        });

        promise.catch(function () {});
        window.__homepagePrefetch__ = { slug: slug, limit: limit, promise: promise };
      } catch (e) {
        /* prefetch is best effort */
      }
    })();
  </script>

  <!--
    Non-render-blocking font load.

    Poppins only. `Montserrat` and `Open+Sans` used to be requested here too and
    were never referenced anywhere: `grep -rn "Montserrat\|Open Sans" src`
    returns zero matches, and every `$font-primary` SCSS variable in the codebase
    resolves to `"Poppins", sans-serif`.

    That mattered more than it looks. Google Fonts emits one `@font-face` block
    per weight *per unicode subset* (latin, latin-ext, and for Open Sans also
    cyrillic, greek, vietnamese…), so three families expanded to 60 blocks.
    Measured against the same mobile UA:

        before  32,371 B CSS, 60 @font-face blocks
        after    6,078 B CSS, 15 @font-face blocks   (-26,293 B, -81%)

    To be precise about the win: unused `@font-face` rules do not download font
    files, so this does not remove 5 font fetches. What it removes is 26 KB of
    CSS on the critical path plus 45 redundant `@font-face` rules the browser
    would otherwise parse and keep in its font-matching set.

    All five Poppins weights are kept because all five are used — measured across
    src: 600 x1614, 500 x569, 700 x485 (+31 `bold`, +11 `font-bold`), 400 x158,
    800 x27. Do not trim these without re-counting.

    Two weights are referenced but NOT requested and so already fall back:
    `font-weight: 900` (5 uses) and `300` (4 uses). Pre-existing and cosmetic —
    left alone rather than adding two more font files for 9 declarations.
  -->
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" media="print" onload="this.media='all'" />
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" /></noscript>

  <!--
    Body background preload, split by viewport.

    Both files were previously covered by a single unconditional preload of the
    desktop artwork. The stylesheet below swaps to the -mobile file at 767px, so
    on a phone the 476 KB desktop PNG was downloaded at high priority and then
    never painted — measured 1142ms -> 6161ms on a 4 Mbps profile, holding a
    high-priority slot against the entry bundle for five seconds while the
    97 KB mobile file was fetched separately.

    The `media` attribute is honoured for rel=preload, so each viewport now
    fetches only the file its stylesheet will actually use. Breakpoint matches
    the 767px used in the inline CSS below and throughout the SCSS.

    fetchpriority is deliberately NOT set to "high" here. This artwork is a
    decorative full-page backdrop, never the LCP element — on the homepage that
    is the pageblocker banner inside HomeIntroPopup, which sits four serial hops
    downstream (HTML -> entry JS -> React render -> /api/homepage -> image).
    The desktop PNG is 476 KB; promoting it to "high" put it in direct
    contention with the entry bundle, delaying every hop behind it. At the
    default priority for rel=preload as=image it still starts during HTML parse,
    it just stops outranking the script that unblocks the actual LCP element.
    `background-color: #ebecf2` in the inline CSS below covers the gap, so the
    later paint is a colour-to-artwork swap, not a flash of white.

    Applied 2026-09-04: the paragraph above has said "deliberately NOT set to
    high" for some time, but both tags still carried `fetchpriority="high"`. The
    reasoning was written and never applied to the markup. Independently
    re-verified before removing it: per the Largest Contentful Paint API, an
    element with a `url()` background IS an LCP candidate, but Chromium excludes
    "elements that cover the full viewport, that are likely considered as
    background rather than content" (web.dev/articles/lcp). This artwork is
    `background-size: cover; background-attachment: fixed` on
    `body.home-v2-page`, i.e. full-viewport, so it cannot be the LCP element and
    cannot be harmed by dropping to default preload priority.

    Measured payloads over the wire, for the record:
      main-body-bg-new.png         486,842 B  (desktop, >=768px)
      main-body-bg-new-mobile.png   98,604 B  (mobile,  <=767px)
