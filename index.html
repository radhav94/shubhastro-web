  <script>
    // Storage safety net. MUST stay the first script on the page.
    //
    // When a browser blocks site data, merely READING `window.localStorage`
    // throws "Access is denied for this document" — it does not return null.
    // The app touches localStorage in ~560 places, including a module-scope IIFE
    // in main.jsx that runs before React mounts, so a single throw there aborts
    // evaluation of the bundle and the user gets a blank page. That shows up in
    // analytics as a sub-10-second, zero-click bounce.
    //
    // Rather than guard 560 call sites, swap in an in-memory implementation when
    // the real one is unavailable. The app then runs normally for the visit;
    // nothing persists across reloads, which is the correct outcome for someone
    // who has blocked storage anyway.
    //
    // This has to live in index.html because ES module imports are evaluated
    // before the importing module's body — so no code inside the bundle can be
    // guaranteed to run first.
    (function () {
      function createMemoryStorage() {
        var data = Object.create(null);
        return {
          getItem: function (key) {
            var k = String(key);
            return Object.prototype.hasOwnProperty.call(data, k) ? data[k] : null;
          },
          setItem: function (key, value) { data[String(key)] = String(value); },
          removeItem: function (key) { delete data[String(key)]; },
          clear: function () { data = Object.create(null); },
          key: function (i) { var keys = Object.keys(data); return i in keys ? keys[i] : null; },
          get length() { return Object.keys(data).length; }
        };
      }

      function isUsable(name) {
        try {
          // The property read itself is what throws when access is denied.
          var store = window[name];
          if (!store) return false;
          // Safari private mode and zero-quota contexts expose the object but
          // reject writes, so probe before trusting it.
          var probe = '__storage_probe__';
          store.setItem(probe, '1');
          store.removeItem(probe);
          return true;
        } catch (e) {
          return false;
        }
      }

      ['localStorage', 'sessionStorage'].forEach(function (name) {
        if (isUsable(name)) return;
        try {
          Object.defineProperty(window, name, {
            value: createMemoryStorage(),
            configurable: true
          });
          if (window.console && console.warn) {
            console.warn('[storage] ' + name + ' unavailable — using in-memory fallback for this visit.');
          }
        } catch (e) {
          /* Nothing more we can do; individual call sites will still throw. */
        }
      });
    })();
  </script>
  <script>
    // Global error reporting. Registered early (right after the storage shim) so
    // it also sees failures during bundle parse/evaluation, not just runtime.
    //
    // Two gaps this closes:
    //
    // 1. Opacity. When a script from another origin throws without CORS headers,
    //    the browser hands us the string "Script error." with no file, line or
    //    stack. Analytics then shows an unactionable "script error" that is
    //    indistinguishable from a real app bug. Our own bundle is same-origin
    //    and carries `crossorigin`, so anything masked like this is third-party
    //    (tag manager, analytics, Agora, Maps) — worth labelling as such rather
    //    than chasing.
    //
    // 2. Unhandled promise rejections were not observed at all. A rejected
    //    promise with no .catch() previously vanished silently.
    //
    // Reports go to Clarity (so they attach to the session recording) and to
    // dataLayer. Deliberately does not swallow anything: the browser still logs.
    (function () {
      var MAX_REPORTS = 10;
      var sent = 0;
      var seen = {};

      function report(kind, message, source, extra) {
        try {
          message = String(message || 'unknown').slice(0, 300);

          // A cross-origin throw is stripped to this exact shape. Naming it
          // stops it being mistaken for an app-level failure.
          var masked = (message === 'Script error.' || message === 'Script error') && !source;
          var key = kind + '|' + message + '|' + (source || '');
          if (seen[key]) return;
          seen[key] = true;
          if (sent >= MAX_REPORTS) return;
          sent++;

          if (typeof window.clarity === 'function') {
            window.clarity('set', 'jsErrorKind', masked ? 'cross_origin_masked' : kind);
            window.clarity('set', 'jsErrorMessage', message);
          }

          window.dataLayer = window.dataLayer || [];
          window.dataLayer.push({
            event: 'js_error',
            error_kind: kind,
            error_masked: masked,
            error_message: message,
            error_source: source || '(unavailable)',
            error_detail: extra || ''
          });
        } catch (e) {
          /* reporting must never itself break the page */
        }
      }

      window.addEventListener('error', function (e) {
        // Resource load failures (img/script/link) surface here too, with the
        // element as target and no message — report them separately.
        if (e && e.target && e.target !== window && e.target.tagName) {
          report(
            'resource_error',
            e.target.tagName.toLowerCase() + ' failed to load',
            e.target.currentSrc || e.target.src || e.target.href || ''
          );
          return;
        }
        report(
          'uncaught_error',
          e && e.message,
          e && e.filename ? e.filename + ':' + e.lineno + ':' + e.colno : '',
          e && e.error && e.error.stack ? String(e.error.stack).slice(0, 500) : ''
        );
      }, true);

      window.addEventListener('unhandledrejection', function (e) {
        var r = e && e.reason;
        var msg = r && r.message ? r.message : String(r);
        report(
          'unhandled_rejection',
          msg,
          '',
          r && r.stack ? String(r.stack).slice(0, 500) : ''
        );
      });
    })();
  </script>
  <script>
    // iOS Safari/Chrome ignore `user-scalable=no`, so pinch/double-tap still
    // zoom the whole page (e.g. when zooming a photo on the AI-Wow camera
    // screens). Enforce the declared no-zoom intent by blocking the zoom
    // gestures at the document level.
    (function () {
      ['gesturestart', 'gesturechange', 'gestureend'].forEach(function (evt) {
        document.addEventListener(evt, function (e) { e.preventDefault(); }, { passive: false });
      });
      var lastTouchEnd = 0;
      document.addEventListener('touchend', function (e) {
        var now = Date.now();
        if (now - lastTouchEnd <= 300) { e.preventDefault(); }
        lastTouchEnd = now;
      }, { passive: false });
    })();
  </script>

  <!--
    Body background preload, split by viewport.

    Both files were previously covered by a single unconditional preload of the
    desktop artwork. The stylesheet below swaps to the -mobile file at 767px, so
    on a phone the 476 KB desktop PNG was downloaded at high priority and then
    never painted — measured 1142ms -> 6161ms on a 4 Mbps profile, holding a
    high-priority slot against the entry bundle for five seconds while the
    97 KB mobile file was fetched separately.

    The `media` attribute is honoured for rel=preload, so each viewport now
    fetches only the file its stylesheet will actually use. Breakpoint matches
    the 767px used in the inline CSS below and throughout the SCSS.
  -->
  <link rel="preload" as="image" href="https://assets.shubhastro.ai/main-body-bg-new.png" fetchpriority="high" media="(min-width: 768px)" />
  <link rel="preload" as="image" href="https://assets.shubhastro.ai/main-body-bg-new-mobile.png" fetchpriority="high" media="(max-width: 767px)" />

    with an Origin header returns `access-control-allow-origin` for this origin.

    would fail CORS and the script would not load at all.
  -->

  <script async crossorigin="anonymous" src="https://www.googletagmanager.com/gtag/js?id=G-MQBQTN9GSH"></script>
