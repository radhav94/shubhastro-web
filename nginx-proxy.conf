# =============================================================================
# Nginx production configuration for ShubhTalk
# =============================================================================
#
# Single host, path-based gateway:
#   - The SPA (Vite `dist/`) is served as static files from https://shubhastro.ai
#   - The encrypting secure gateway is mounted on the SAME origin under /sgw,
#     reverse-proxied to the Node process on 127.0.0.1:8787.
#
#   browser ──> https://shubhastro.ai/                 (static SPA)
#           └─> https://shubhastro.ai/sgw/main/api/... (──> 127.0.0.1:8787 ──> upstream)
#
# Because the gateway is same-origin, there is NO CORS: no preflight, and
# SGW_ALLOWED_ORIGINS can stay empty in production.
#
# How the path maps:
#   /sgw/main/api/x        -> nginx strips /sgw -> gateway gets /main/api/x
#                          -> gateway strips /main -> upstream gets /api/x
#   /sgw/__sgw/handshake   -> gateway /__sgw/handshake
#   /sgw/main/socket.io    -> gateway /main/socket.io  (WebSocket)
#
# The frontend builds these URLs automatically from VITE_SGW_URL="/sgw"
# (see src/utils/apiConfig.js).
#
# Run the gateway as a managed service (systemd / pm2):
#   cd secure-gateway && npm install && npm start
#
# Before going live, replace the TODO markers (dist root + cert paths).
# =============================================================================

# Upstream for the Node secure gateway (keep it bound to 127.0.0.1).
upstream shubhtalk_gateway {
    server 127.0.0.1:8787;
    keepalive 32;
}

# WebSocket upgrade helper: "upgrade" when the client requests it, else "close".
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# -----------------------------------------------------------------------------
# HTTP -> HTTPS redirect (keeps ACME http-01 challenge working).
# -----------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name shubhastro.ai www.shubhastro.ai;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# -----------------------------------------------------------------------------
# Frontend host — serves the SPA and proxies /sgw to the secure gateway.
# -----------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name shubhastro.ai www.shubhastro.ai;

    # TODO: point at your real certificates.
    ssl_certificate     /etc/letsencrypt/live/shubhastro.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/shubhastro.ai/privkey.pem;

    # Modern TLS only.
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # Security headers.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "SAMEORIGIN" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

    # Permissions-Policy: deny powerful features this app never uses, and scope
    # the ones it does use to same-origin only.
    #
    # Allowed as `self` because they are genuinely used:
    #   camera      - AI-Wow scanners (palmistry, face reading, gemstone, aura,
    #                 signature, cloth colour) and video calls
    #   microphone  - Pandit AI voice (useSarvamSTT) and voice/video calls
    #   geolocation - 8 references in src, 2 direct navigator.geolocation calls
    #
    # Denied outright after checking usage across src (0 references each):
    #   usb, bluetooth, midi, serial, hid, magnetometer, gyroscope,
    #   accelerometer, idle-detection
    #
    # Deliberately NOT listed, so the browser default applies:
    #   payment    - Razorpay checkout must not be constrained; the Payment
    #                Request API is not used directly (0 references) but the
    #                checkout iframe's own behaviour is not worth risking
    #   fullscreen - live streaming and video call UI may request it
    add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=(self), usb=(), bluetooth=(), midi=(), serial=(), hid=(), magnetometer=(), gyroscope=(), accelerometer=(), idle-detection=()" always;

    # -------------------------------------------------------------------------
    # Source maps must not be publicly fetchable.
    #
    # vite.config.js uses `sourcemap: 'hidden'`, which omits the
    # //# sourceMappingURL comment so DevTools will not auto-load maps. It does
    # NOT make them unreachable: map filenames are derived mechanically from the
    # chunk filenames, and those are listed in index.html. The current build
    # emits 299 .map files totalling 47 MB, including a ~7.2 MB map for the entry
    # chunk, which together reconstruct the original source.
    #
    # Regex locations are matched before prefix locations, so this takes effect
    # ahead of `location /assets/` below without needing to be moved.
    #
    # 404 rather than 403 so the response does not confirm the file exists.
    #
    # This is one of two independent controls; the other is excluding .map from
    # the deploy artifact entirely. Keep both — this one alone still ships the
    # files to the server's disk.
    #
    # Nothing consumes these maps: no Sentry/Bugsnag/Rollbar/Datadog exists in
    # package.json or src. If error monitoring is added later, upload maps to it
    # privately from CI instead of relaxing this rule.
    # -------------------------------------------------------------------------
    location ~* \.map$ {
        access_log off;
        return 404;
    }

    # TODO: set this to your deployed build output.
    root /var/www/shubhtalk-web-v2/dist;
    index index.html;

    # Redirect www -> apex (optional; drop this block to keep www).
    if ($host = www.shubhastro.ai) {
        return 301 https://shubhastro.ai$request_uri;
    }

    # Uploads (profile images, chat audio, etc.) flow through /sgw to the backend.
    client_max_body_size 25m;

    # -------------------------------------------------------------------------
    # Secure gateway, mounted on the same origin under /sgw.
    # The trailing slash on proxy_pass strips the /sgw prefix:
    #   /sgw/main/api/x  ->  upstream receives  /main/api/x
    # ^~ gives this prefix priority over the SPA `location /`.
    # -------------------------------------------------------------------------
    location ^~ /sgw/ {
        proxy_pass http://shubhtalk_gateway/;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # WebSocket support (socket.io on /sgw/main/socket.io). NOTE: WS frames
        # are NOT encrypted by the gateway — socket.io payloads remain visible.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Streaming-friendly: let the gateway control buffering/encoding.
        proxy_buffering off;
        proxy_request_buffering off;

        # Long timeouts for sockets / long-poll; tune for your traffic.
        proxy_connect_timeout 30s;
        proxy_send_timeout    86400s;
        proxy_read_timeout    86400s;
    }

    # -------------------------------------------------------------------------
    # NOTE ON THE REPEATED HEADERS BELOW — this is not copy-paste sloppiness.
    #
    # nginx inherits `add_header` from the enclosing level ONLY IF the current
    # level declares no `add_header` of its own. The moment a location adds one
    # (e.g. Cache-Control), every server-level header is dropped for that
    # response.
    #
    # Before this change that meant the three locations declaring Cache-Control
    # were served with NO security headers at all — including
    # `location = /index.html`, the app shell itself, which was therefore missing
    # X-Frame-Options (clickjacking), nosniff, HSTS and Referrer-Policy on the
    # main document. That is the response where they matter most.
    #
    # So the headers are restated in each location that overrides. If this list
    # grows, move it to a snippet file and `include` it in each block — but keep
    # them present, do not rely on inheritance that nginx does not perform.
    # -------------------------------------------------------------------------

    # Hashed, immutable build assets — cache hard.
    location /assets/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
        # nosniff is the one that genuinely matters for JS/CSS responses.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options    "nosniff" always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    # Never cache the service worker or the app shell (must pick up new builds).
    location = /firebase-messaging-sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires off;
        try_files $uri =404;
    }
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires off;
        # Restated because the Cache-Control above suppresses inheritance. This
        # is the app shell — without these the main document had no clickjacking
        # protection. See the note above /assets/.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options    "nosniff" always;
        add_header X-Frame-Options           "SAMEORIGIN" always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=(self), usb=(), bluetooth=(), midi=(), serial=(), hid=(), magnetometer=(), gyroscope=(), accelerometer=(), idle-detection=()" always;
    }

    # SPA fallback — serve index.html for all client-side routes.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
