# API Proxy Configuration for ShubhTalk
# Add these location blocks inside your server {} block
# that serves the frontend (the one with root /path/to/dist)

# Main backend API + WebSocket (socket.io)
location /main/ {
    proxy_pass https://njsapi.shubhastro.ai/;
    proxy_http_version 1.1;
    proxy_set_header Host njsapi.shubhastro.ai;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # WebSocket support (for socket.io)
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 86400;
    proxy_send_timeout 86400;
}

# Vedic Astrology API
location /vedic/ {
    proxy_pass https://json.astrologyapi.com/;
    proxy_http_version 1.1;
    proxy_set_header Host json.astrologyapi.com;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_ssl_server_name on;
}

# Chart generation service (Python)
location /chart/ {
    proxy_pass https://pyapi-shubhtalk.epicon.in/;
    proxy_http_version 1.1;
    proxy_set_header Host pyapi-shubhtalk.epicon.in;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_ssl_server_name on;
}

# Voice TTS/STT service
location /voice/ {
    proxy_pass https://api.sarvam.ai/;
    proxy_http_version 1.1;
    proxy_set_header Host api.sarvam.ai;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_ssl_server_name on;
    proxy_pass_request_headers on;
}

# SPA fallback — serve index.html for all other routes
location / {
    try_files $uri $uri/ /index.html;
}
