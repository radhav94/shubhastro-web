# API Proxy Configuration for ShubhTalk
# Add these location blocks inside your server {} block
# that serves the frontend (the one with root /path/to/dist)
#
# All API traffic now flows through the encrypting BFF (see /bff), which sits on
# 127.0.0.1:8787. The BFF strips the route prefix (/main, /vedic, ...) and
# forwards to the real upstream, encrypting JSON response bodies on the way back.
#
# IMPORTANT: proxy_pass has NO trailing slash and NO path, so nginx forwards the
# FULL original URI (including the /main prefix) to the BFF. The BFF — not nginx —
# is responsible for stripping the prefix and setting the upstream Host header.
#
# Run the BFF as a service (e.g. systemd / pm2): cd bff && npm install && npm start

# ECDH key-exchange endpoint (must reach the BFF)
location /__bff/ {
    proxy_pass http://127.0.0.1:8787;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Main backend API + WebSocket (socket.io) -> BFF -> njsapi.shubhastro.ai
location /main/ {
    proxy_pass http://127.0.0.1:8787;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # WebSocket support (for socket.io). NOTE: WS frames are NOT encrypted by
    # the BFF — socket.io payloads remain visible in the Network tab.
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 86400;
    proxy_send_timeout 86400;
}

# Vedic Astrology API -> BFF -> json.astrologyapi.com
location /vedic/ {
    proxy_pass http://127.0.0.1:8787;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Chart generation service (Python) -> BFF -> pyapi-shubhtalk.epicon.in
location /chart/ {
    proxy_pass http://127.0.0.1:8787;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Voice TTS/STT service (passthrough, binary — not encrypted) -> BFF -> api.sarvam.ai
location /voice/ {
    proxy_pass http://127.0.0.1:8787;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# SPA fallback — serve index.html for all other routes
location / {
    try_files $uri $uri/ /index.html;
}
